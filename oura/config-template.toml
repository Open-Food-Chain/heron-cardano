# Oura v2 config. v1 never sends N2N keep-alives, so the node drops it every
# ~97 s and it never syncs; v2 keeps the connection open.
[source]
type = "N2N"
peers = ["preprod-node.play.dev.cardano.org:3001"]

[chain]
type = "preprod"

[intersect]
type = "{{ starting_point_type }}"
{% if starting_point_type == "Point" %}
value = [ {{ slot }}, "{{ block_hash }}" ]
{% endif %}

# Hold each block until 10 more are on top of it (v1's min_depth = 10).
# Must come before SplitBlock: it keeps one record per block.
[[filters]]
type = "RollbackBuffer"
min_depth = 10

# One entry per transaction, as parsed JSON with "hash" in base64.
[[filters]]
type = "SplitBlock"

[[filters]]
type = "ParseCbor"

[sink]
type = "Redis"
url = "redis://redis:6379/0"
stream_name = "oura.events"
stream_max_length = 20000

[metrics]
address = "0.0.0.0:9186"
endpoint = "/metrics"

[cursor]
type = "File"
path = "/app/oura/cursor"
